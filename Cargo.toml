[package]
name = "bark"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
color-eyre = "0.6.5"
gtk = { version = "0.11.4", package = "gtk4" }
gtk4-layer-shell = "0.8.1"
niri-ipc = "26.4.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
